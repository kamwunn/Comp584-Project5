<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Card Set Explorer</title>
  <style>
    #card {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
    }

    #card img {
        display: block;
        max-width: 100%;
        height: auto;
    }
    
    #card h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
        line-height: 1.25;
        min-height: 2.5em;
    }
    .card-flip {
        display: block;
        width: 100%;
        max-width: 220px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        perspective: 800px;
    }

    .card-flip:focus-visible {
        outline: 3px solid #245ad4;
        outline-offset: 4px;
    }

    .card-flip-inner {
        display: grid;
        transform-style: preserve-3d;
        transition: transform 650ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-flip[aria-pressed="true"] .card-flip-inner {
        transform: rotateY(180deg);
    }

    .card-face {
        grid-area: 1 / 1;
        backface-visibility: hidden;
    }

    #card .card-front {
        width: 100%;
    }

    .card-back {
        display: grid;
        place-content: center;
        gap: 0.5rem;
        padding: 0.75rem;
        border-radius: 0.5rem;
        background: #18283e;
        color: white;
        text-align: center;
        transform: rotateY(180deg);
    }

    @media (prefers-reduced-motion: reduce) {
        .card-flip-inner {
            transition: none;
        }
    }      
</style>
</head>
<body>
  <h1>Pokémon Card Set Explorer</h1>
  <p id="status" role="status">Loading cards…</p>
  <article id="card" aria-label="Pokémon cards"></article>

  <script type="module">
    const status = document.querySelector('#status');
    const cardContainer = document.querySelector('#card');

    try {
      const response = await fetch('https://api.tcgdex.net/v2/en/sets/sv01');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const set = await response.json();
      const cards = set.cards.filter(card => card.image).slice(0, 12);

    for (const card of cards) {
        const tile = document.createElement('article');
        const cardLabel = `#${card.localId} ${card.name}`;

        const title = document.createElement('h2');
        title.textContent = cardLabel;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'card-flip';
        button.setAttribute('aria-label', `Flip ${cardLabel}`);
        button.setAttribute('aria-pressed', 'false');

        const inner = document.createElement('span');
        inner.className = 'card-flip-inner';

        const image = document.createElement('img');
        image.className = 'card-face card-front';
        image.src = `${card.image}/low.webp`;
        image.alt = '';

        const back = document.createElement('span');
        back.className = 'card-face card-back';
        back.textContent = cardLabel;
        back.setAttribute('aria-hidden', 'true');

        button.addEventListener('click', () => {
            const isFlipped = button.getAttribute('aria-pressed') === 'true';
            button.setAttribute('aria-pressed', String(!isFlipped));
        });

        inner.append(image, back);
        button.append(inner);
        tile.append(title, button);
        cardContainer.append(tile);
    }

        status.textContent = `${set.name} · Showing ${cards.length} cards`;
    } catch (error) {
      status.textContent = `Could not load cards. ${error.message}`;
    }
  </script>
</body>
</html>
